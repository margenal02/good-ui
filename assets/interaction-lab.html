const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n};
function button(txt,cls,fn){const n=el('button',cls,txt);n.type='button';n.addEventListener('click',fn);return n}
let active=0, generation=0, timers=[], savedDays=2, draft=2;
function soon(fn,ms){const g=generation;timers.push(setTimeout(()=>{if(g===generation)fn()},ms))}
const status=s=>$('status').textContent=s;
function panel(markup){$('demo').innerHTML=markup}
const menuButtons=cases.map((c,i)=>{const n=button('','',()=>show(i));n.append(el('span','index',String(i+1).padStart(2,'0')),el('span','',c[0]));$('menu').append(n);return n});

const picker=el('select','example-select');
picker.id='casePicker';picker.setAttribute('aria-label','选择交互案例');
cases.forEach(([name],i)=>{const option=el('option','',String(i+1).padStart(2,'0')+' / '+cases.length+'　'+name);option.value=i;picker.append(option)});
picker.onchange=()=>show(Number(picker.value));$('menu').after(picker);

function show(i){picker.value=String(i);if($('sheet').open)$('sheet').close();generation++;timers.forEach(clearTimeout);timers=[];active=i;const c=cases[i];menuButtons.forEach((n,j)=>n.setAttribute('aria-pressed',String(i===j)));$('heading').textContent=c[1];$('desc').textContent=c[2];$('tryText').textContent=c[3];$('look').textContent=c[4];$('stageTag').textContent=c[6];$('source').href='https://www.douyin.com/video/'+c[5];$('actions').replaceChildren();$('demo').replaceChildren();[cards,drawer,dial,submitDemo,rangeDemo,removeDemo,reorderDemo,searchDemo,accordionDemo,skeletonDemo,packDemo,monthDemo,segmentDemo,imeDemo][i]()}

function cards(){let index=0,start=null,offset=0,busy=false;panel('<div class="stack"><div class="photo" id="photo" role="group" tabindex="0" aria-label="风景卡片，用左右方向键切换"><img id="scenery" draggable="false"><div class="caption"><strong id="caption"></strong><span class="counter" id="counter"></span></div></div></div>');const card=$('photo');function paint(){const name=names[index];$('scenery').src=photos[index];$('scenery').alt=name;$('caption').textContent=name;$('counter').textContent=String(index+1).padStart(2,'0')+' / 03'}function move(by){if(busy||start!==null)return;busy=true;card.style.transition='';card.style.transform='translateX('+(-by*90)+'px) rotate('+(-by*9)+'deg)';card.style.opacity='0';soon(()=>{index=(index+by+3)%3;paint();card.style.transform='';card.style.opacity='1';status('已切换 · '+names[index]);busy=false},matchMedia('(prefers-reduced-motion: reduce)').matches?0:170)}function end(e,cancel){if(start===null||e.pointerId!==start.id)return;const x=cancel?0:e.clientX-start.x;start=null;card.style.transition='';if(!cancel&&Math.abs(x)>=card.offsetWidth*.25){move(x<0?1:-1)}else{card.style.transform='';status('已回到原位')}}card.onpointerdown=e=>{if(busy||start||e.button!==0)return;start={x:e.clientX,id:e.pointerId};offset=0;card.setPointerCapture(e.pointerId);card.style.transition='none'};card.onpointermove=e=>{if(!start||e.pointerId!==start.id)return;offset=e.clientX-start.x;card.style.transform='translateX('+Math.max(-120,Math.min(120,offset))+'px) rotate('+Math.max(-13,Math.min(13,offset*.07))+'deg)';const msg=Math.abs(offset)>=card.offsetWidth*.25?'松手换卡':'松手回弹';if($('status').textContent!==msg)status(msg)};card.onpointerup=e=>end(e,false);card.onpointercancel=e=>end(e,true);card.onkeydown=e=>{if(['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();move(e.key==='ArrowRight'?1:-1)}};$('actions').append(button('上一张','pill',()=>move(-1)),button('下一张','primary',()=>move(1)));paint();status('等待拖动')}

$('less').onclick=()=>{draft=Math.max(1,draft-1);updateDays()};$('more').onclick=()=>{draft=Math.min(7,draft+1);updateDays()};$('confirmDays').onclick=()=>{savedDays=draft;$('tripDays').textContent='已选 '+savedDays+' 天';$('sheet').close('confirmed')};$('closeSheet').onclick=()=>$('sheet').close('cancel');$('sheet').addEventListener('cancel',()=>$('sheet').returnValue='cancel');$('sheet').addEventListener('close',()=>{if(active===1){status($('sheet').returnValue==='confirmed'?'已确认 · '+savedDays+' 天':'已收起 · '+savedDays+' 天');$('openSheet')?.focus()}});$('sheet').onclick=e=>{if(e.target!==e.currentTarget)return;const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('sheet').close('cancel')};let gripY=null;$('grip').onpointerdown=e=>{gripY=e.clientY;e.target.setPointerCapture(e.pointerId)};$('grip').onpointermove=e=>{if(gripY!==null)$('sheet').style.transform='translateY('+Math.max(0,e.clientY-gripY)+'px)'};function endGrip(e){if(gripY!==null&&e.type==='pointerup'&&e.clientY-gripY>65)$('sheet').close('cancel');gripY=null;$('sheet').style.transform=''}$('grip').onpointerup=$('grip').onpointercancel=endGrip;
function dial(){let temp=23,pid=null;panel('<div class="widget dialwrap"><div class="dial" id="dial" tabindex="0" role="slider" aria-label="目标温度" aria-valuemin="16" aria-valuemax="30"><div class="hand"></div><output id="degrees"></output></div><div class="row"><button class="round" id="cool" aria-label="降低一度">−</button><strong>目标温度</strong><button class="round" id="warm" aria-label="升高一度">+</button></div></div>');const d=$('dial');function set(v){temp=Math.max(16,Math.min(30,v));d.style.setProperty('--a',(temp-16)*270/14+'deg');d.style.setProperty('--heat',temp>25?'#bf733d':'#459c85');d.setAttribute('aria-valuenow',temp);d.setAttribute('aria-valuetext',temp+' 摄氏度');$('degrees').textContent=temp+'°';$('cool').disabled=temp===16;$('warm').disabled=temp===30;status(temp===16?'已达下限':temp===30?'已达上限':temp+'℃')}function turn(e){const r=d.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(Math.hypot(x,y)<16)return;let deg=Math.atan2(x,-y)*180/Math.PI;if(Math.abs(deg)>135&&pid!==null){deg=temp<23?-135:135}set(Math.round(16+(Math.max(-135,Math.min(135,deg))+135)*14/270))}d.onpointerdown=e=>{if(pid!==null||e.button!==0)return;d.focus();pid=e.pointerId;d.setPointerCapture(pid);turn(e)};d.onpointermove=e=>{if(pid===e.pointerId)turn(e)};d.onpointerup=d.onpointercancel=e=>{if(e.pointerId===pid)pid=null};d.onkeydown=e=>{let v={ArrowRight:temp+1,ArrowUp:temp+1,ArrowDown:temp-1,ArrowLeft:temp-1,Home:16,End:30}[e.key];if(v!==undefined){e.preventDefault();set(v)}};$('warm').onclick=()=>set(temp+1);$('cool').onclick=()=>set(temp-1);set(temp)}
function submitDemo(){let busy=false;panel('<div class="widget"><h2>保存旅行偏好</h2><p class="sub">本地演示 · 偏好为山间步行</p><button id="save" class="primary save">保存偏好</button><div class="track" aria-hidden="true"><div class="fill" id="progress"></div></div><label class="setting"><input type="checkbox" id="fail">让下一次保存失败</label></div>');$('progress').style.width='0';$('save').onclick=()=>{if(busy)return;busy=true;const fail=$('fail').checked;$('fail').checked=false;$('fail').disabled=true;const btn=$('save');btn.disabled=true;btn.dataset.phase='busy';btn.textContent='正在保存…';status('提交中');$('progress').style.width='35%';soon(()=>$('progress').style.width='75%',350);soon(()=>{busy=false;btn.disabled=false;$('fail').disabled=false;btn.dataset.phase=fail?'error':'done';btn.textContent=fail?'重新保存':'再次保存';$('progress').style.width=fail?'0':'100%';status(fail?'保存失败，可重试':'保存成功')},900)};status('待提交')}
function rangeDemo(){const fares=[180,260,420,620,840];panel('<div class="widget"><h2>路线预算</h2><p class="sub">按每人预算筛选 5 条示例路线</p><div class="money" id="budget"></div>'+[['lo','最低价',100],['hi','最高价',700]].map(([id,txt,v])=>'<div class="range-row"><label for="'+id+'">'+txt+'<output id="'+id+'Out"></output></label><input id="'+id+'" type="range" min="100" max="900" step="10" value="'+v+'"></div>').join('')+'</div>');function set(id){const a=$('lo'),b=$('hi');if(+a.value>+b.value){if(id==='lo')a.value=b.value;else b.value=a.value}$('budget').textContent='¥'+a.value+' – ¥'+b.value;$('loOut').textContent='¥'+a.value;$('hiOut').textContent='¥'+b.value;status('匹配 '+fares.filter(v=>v>=+a.value&&v<=+b.value).length+' 条路线')};['lo','hi'].forEach(id=>$(id).oninput=()=>set(id));set('lo')}

function reorderDemo(){
  panel('<div class="widget"><h2>湖畔半日线</h2><div id="stops"></div></div>');
  const stops=['湖边码头','山间茶室','林下书屋'];
  let dragging=null;
  function move(from,to){
    if(from===null || from===to || to<0 || to>=stops.length)return;
    const [name]=stops.splice(from,1);stops.splice(to,0,name);render();
    const controls=$('stops').children[to].querySelectorAll('button');
    (to>from&&!controls[1].disabled?controls[1]:!controls[0].disabled?controls[0]:controls[1]).focus();
  }
  function render(){
    $('stops').replaceChildren();
    stops.forEach((name,i)=>{
      const row=el('div','triprow'),label=el('div','rank'),actions=el('div','move');
      label.append(el('small','',String(i+1).padStart(2,'0')),el('strong','',name));
      for(const [offset,word] of [[-1,'上移'],[1,'下移']]){
        const b=button(word,'',()=>move(i,i+offset));b.disabled=!stops[i+offset];b.setAttribute('aria-label',word+name);actions.append(b);
      }
      row.draggable=true;
      row.ondragstart=e=>{dragging=i;e.dataTransfer.setData('text/plain',name);e.dataTransfer.effectAllowed='move'};
      row.ondragover=e=>e.preventDefault();row.ondrop=e=>{e.preventDefault();move(dragging,i);dragging=null};row.ondragend=()=>dragging=null;
      row.append(label,actions);$('stops').append(row);
    });status(stops.join(' → '));
  }
  render();
}
function searchDemo(){
  panel('<div class="widget"><h2>目的地清单</h2><label for="query">搜索地点</label><input class="lab-field" type="search" id="query" placeholder="输入湖、山或林"><div id="options" class="lab-chips" role="group" aria-label="匹配地点"></div><strong>已选地点</strong><div id="picked" class="lab-chips"></div></div>');
  const places=['青湖码头','湖畔木屋','云山茶室','山间小径','松林驿站'],selected=new Set();
  function render(){
    const matches=places.filter(x=>x.includes($('query').value.trim()));
    $('options').replaceChildren();$('picked').replaceChildren();
    for(const name of matches){
      const b=button(name,'',()=>{if(selected.has(name))selected.delete(name);else selected.add(name);render();Array.from($('options').children).find(n=>n.textContent===name)?.focus()});
      b.setAttribute('aria-pressed',String(selected.has(name)));$('options').append(b);
    }
    if(!matches.length)$('options').append(el('span','empty-note','没有匹配地点，可以换个关键词'));
    for(const name of selected){
      const b=button(name+' ×','',()=>{selected.delete(name);render();$('query').focus()});b.setAttribute('aria-label','移除'+name);$('picked').append(b);
    }
    if(!selected.size)$('picked').append(el('span','empty-note','还没有选择地点'));
    status('匹配 '+matches.length+' 处 · 已选 '+selected.size+' 处');
  }
  $('query').oninput=render;render();
}

function monthDemo(){

    track.append(bar);row.append(el('span','','第'+(i+1)+'周'),track,value);$('weeks').append(row);return {bar,value};
  });

function segmentDemo(){
  panel('<div class="widget"><h2>沿湖一日线</h2><div class="segment" id="modes" role="group" aria-label="路线分组"></div><div id="groups"></div></div>');
  const places=[['码头','上午','东岸'],['林间茶室','上午','西岸'],['观景台','下午','东岸'],['栈道','下午','西岸']];
  function group(key){
    const groups=new Map();for(const place of places){if(!groups.has(place[key]))groups.set(place[key],[]);groups.get(place[key]).push(place[0])}
    $('groups').replaceChildren();for(const [title,names] of groups){const list=el('ul','group-list');names.forEach(n=>list.append(el('li','',n)));$('groups').append(el('h3','lab-section',title),list)}
    Array.from($('modes').children).forEach((b,i)=>b.setAttribute('aria-pressed',String(key===i+1)));status((key===1?'按时段':'按区域')+' · 共 4 站');
  }

function imeDemo(){
  panel('<div class="widget"><h2>随行便签</h2><label for="memo">行程备注</label><input id="memo" class="lab-field" maxlength="120" placeholder="例如，明早出发"><button class="primary" type="button" id="addMemo">添加备注</button><ul class="notes" id="notes"></ul></div>');
  const input=$('memo'),add=$('addMemo');let composing=false;
  const sync=()=>add.disabled=composing||!input.value.trim();
  function commit(){
    const value=input.value.trim();if(!value||composing)return;
    $('notes').prepend(el('li','',value));input.value='';sync();input.focus();status('已添加 '+$('notes').children.length+' 条备注');
  }
  input.addEventListener('compositionstart',()=>{composing=true;sync()});
  input.addEventListener('compositionend',()=>{composing=false;sync()});
  input.oninput=sync;
  input.onkeydown=e=>{if(e.key==='Enter'&&!e.repeat&&!e.isComposing&&!composing&&e.keyCode!==229){e.preventDefault();commit()}};
  add.onclick=commit;sync();status('等待输入备注');
}
